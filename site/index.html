<head>

  <meta name="description" content="機器學習期中考備考：100 題中英對照選擇題、隨機抽題、即時詳解與講義圖片來源。">
  <title>Recall Lab · 機器學習備考工作台</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
  <a class="skip" href="#main">跳至主要內容</a>
  <div id="app"><main class="loading"><span class="brand-mark">r.</span><h1>Recall Lab</h1><p>正在載入題庫…</p></main></div>
  <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" role="status" hidden></div>
  <dialog id="image-dialog" aria-label="講義圖片放大檢視"><button class="dialog-close" autofocus>關閉圖片 ×</button><img alt=""><p></p></dialog>
  <dialog id="reset-dialog" aria-labelledby="reset-title"><h2 id="reset-title">清除這台裝置的練習紀錄？</h2><p>答題、錯題、收藏與未完成練習都會清除，無法復原。</p><div class="button-row"><button data-cancel-reset>保留紀錄</button><button class="danger-button" data-confirm-reset>清除紀錄</button></div></dialog>
  <dialog id="replace-dialog" aria-labelledby="replace-title"><h2 id="replace-title">開始新的練習？</h2><p>目前有尚未結束的練習。開始新練習會取代這次的題目與進度，累積答題紀錄及收藏仍會保留。</p><div class="button-row"><button data-keep-session autofocus>保留原練習</button><button class="primary" data-replace-session>開始新練習</button></div></dialog>
  <noscript>此網站需要啟用 JavaScript，才能進行題庫練習與儲存進度。</noscript>
</body>
</html>
