<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" role="img" aria-labelledby="title desc"><title id="title">Learning rate and overshooting</title><desc id="desc">A schematic loss curve. A moderate update approaches the minimum; overly large updates jump across it and can oscillate or diverge.</desc><rect width="700" height="360" rx="8" fill="oklch(.18 .006 140)"/><g font-family="sans-serif" fill="oklch(.96 0 0)"><text x="30" y="35" font-size="18">Learning rate · the size of an update</text><text x="30" y="62" font-size="12" fill="oklch(.73 .008 140)">Conceptual illustration, not a numerical training trajectory</text></g><g transform="translate(40 60)"><path d="M30 245H600M30 245V25" fill="none" stroke="oklch(.4 .008 140)"/><path d="M65 45Q300 420 535 45" fill="none" stroke="oklch(.73 .008 140)" stroke-width="2"/><path d="m90 84 382 31-319 49" fill="none" stroke="oklch(.76 .12 55)" stroke-width="2" stroke-dasharray="6 4"/><path d="m153 164 44 33 43 21 42 13" fill="none" stroke="oklch(.88 .16 140)" stroke-width="3"/><g fill="oklch(.76 .12 55)"><circle cx="90" cy="84" r="5"/><circle cx="472" cy="115" r="5"/><circle cx="153" cy="164" r="5"/></g><g fill="oklch(.88 .16 140)"><circle cx="197" cy="197" r="4"/><circle cx="240" cy="218" r="4"/><circle cx="282" cy="231" r="4"/></g><g font-family="sans-serif" font-size="12"><text x="260" y="85" fill="oklch(.76 .12 55)">Too large → overshoot</text><text x="330" y="215" fill="oklch(.88 .16 140)">Smaller steps → approach</text><text x="5" y="17" fill="oklch(.73 .008 140)">Loss</text><text x="490" y="273" fill="oklch(.73 .008 140)">Model parameter →</text></g></g></svg>
