<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 400" role="img" aria-labelledby="title desc"><title id="title">SVM maximum-margin concept</title><desc id="desc">Two classes separated by a decision boundary. Dashed lines mark the margins. Circled points on the margins are support vectors in this simplified separable example.</desc><rect width="700" height="400" rx="8" fill="oklch(.18 .006 140)"/><g font-family="sans-serif" fill="oklch(.96 0 0)"><text x="32" y="38" font-size="18">SVM · A maximum-margin separator</text><text x="32" y="65" font-size="12" fill="oklch(.73 .008 140)">Simplified linearly separable example · original illustration</text></g><g transform="translate(70 60)"><path d="M20 290H420M20 290V35" stroke="oklch(.4 .008 140)" fill="none"/><path d="M80 280 300 60" stroke="oklch(.88 .16 140)" stroke-width="2"/><path d="M40 280 260 60M120 280 340 60" stroke="oklch(.73 .008 140)" stroke-width="1" stroke-dasharray="6 6"/><g fill="oklch(.88 .16 140)"><circle cx="70" cy="160" r="6"/><circle cx="110" cy="100" r="6"/><circle cx="170" cy="95" r="6"/><circle cx="100" cy="220" r="6"/><circle cx="160" cy="160" r="6"/></g><g fill="oklch(.76 .12 55)"><path d="m260 140 7 12h-14ZM330 170l7 12h-14ZM290 220l7 12h-14ZM210 245l7 12h-14ZM370 240l7 12h-14Z"/></g><circle cx="160" cy="160" r="15" fill="none" stroke="oklch(.88 .16 140)"/><circle cx="260" cy="147" r="15" fill="none" stroke="oklch(.76 .12 55)"/><g font-family="sans-serif" font-size="12" fill="oklch(.96 0 0)"><text x="445" y="90">Decision boundary</text><path d="M438 94 283 86" fill="none" stroke="oklch(.88 .16 140)"/><text x="445" y="146">Margin</text><path d="m438 150-112-76" fill="none" stroke="oklch(.73 .008 140)"/><text x="445" y="206">Support vectors</text><path d="m438 210-162-63" fill="none" stroke="oklch(.73 .008 140)"/><text x="67" y="74" fill="oklch(.88 .16 140)">Class A</text><text x="310" y="272" fill="oklch(.76 .12 55)">Class B</text></g></g></svg>
